name: auto deploy

# Publishes the nar and the network update files to GitHub Pages:
#   https://yaya-shiori.github.io/shiories/   (= On_homeurl in ghost/master/dic/*/yaya_homeurl.dic)
# Set "Settings > Pages > Build and deployment > Source" of the repository to "GitHub Actions".

on:
  workflow_run:
    workflows: ["auto check"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not run two deployments at once, and do not cancel one that is running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    # Only after the dictionary check has passed (or when started by hand)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # The commit that the dictionary check ran on
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # ghost/master/dic/system is a submodule (yaya-dic)
          submodules: recursive

      - name: build the nar and the update files
        # .narignore decides what is in the nar, .updateignore what is in updates2.dau and published
        shell: pwsh
        run: ./.github/scripts/build-site.ps1 -OutDir site

      - name: configure pages
        uses: actions/configure-pages@v5

      - name: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
